# XcodeGen spec — regenerate with: xcodegen generate
# Conference layout: iOS app target + local SPM package at repo root.
name: BeyondBoilerplateDemo
options:
  bundleIdPrefix: com.kevinmorales
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "6.0"
  TARGETED_DEVICE_FAMILY: "1,2"
packages:
  BeyondBoilerplateSwiftMacros:
    path: ../..
targets:
  BeyondBoilerplateDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BeyondBoilerplateDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinmorales.BeyondBoilerplateDemo
        PRODUCT_NAME: BeyondBoilerplateDemo
        INFOPLIST_KEY_CFBundleDisplayName: Beyond Boilerplate
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: BeyondBoilerplateSwiftMacros
        product: BeyondBoilerplateMacrosClient
      - package: BeyondBoilerplateSwiftMacros
        product: DemoSupport
schemes:
  BeyondBoilerplateDemo:
    build:
      targets:
        BeyondBoilerplateDemo: all
    run:
      config: Debug
    archive:
      config: Release
